[package]
name = "deck"
version = "0.1.0"
edition = "2021"
description = "A kanban board for terminal agent sessions (Claude Code, Codex, ...) projected over tmux"
license = "MIT"

[dependencies]
anyhow = "1"
dirs = "5"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
strip = true
