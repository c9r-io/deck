name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # arm64 runner: the committed tmux sidecar the contract tests drive is
    # an aarch64 binary
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      DECK_REQUIRE_MODERN_SPEECH: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          # keep in step with rust-toolchain.toml at the repository root
          toolchain: 1.97.1
          components: clippy, rustfmt
      - name: Install pinned coverage and audit runners
        run: |
          cargo install cargo-llvm-cov --version 0.8.5 --locked
          cargo install cargo-audit --version 0.22.2 --locked
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            app/src-tauri

      # one workspace (app/src-tauri + its status-helper member): fmt --check,
      # clippy -D warnings, tests with coverage — each once
      - name: cargo fmt
        run: cargo fmt --all --check --manifest-path app/src-tauri/Cargo.toml

      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets --all-features --locked --manifest-path app/src-tauri/Cargo.toml -- -D warnings

      # single-threaded: tmux contract tests + storage/scheduler recovery
      # tests share process-wide state (throwaway tmux servers, env)
      - name: cargo test + coverage (unit, storage/scheduler recovery, log privacy, tmux contract, status helper)
        run: cargo llvm-cov --workspace --all-targets --all-features --locked --fail-under-lines 70 --fail-under-functions 70 --manifest-path app/src-tauri/Cargo.toml -- --test-threads=1

      # no-build frontend, three gates:
      # 1. real syntax check of every module (node --check)
      - name: JS syntax (node --check)
        run: |
          set -e
          for f in app/ui/js/*.js app/ui/js/i18n/*.js app/ui/js/*.mjs app/ui/test/*.mjs; do
            node --check "$f"
          done
      # 2. headless pure + production-module DOM tests (node:test, no npm).
      #    WKWebView smoke runs in the app separately; Node counts only .test.mjs.
      - name: JS unit tests + coverage
        run: scripts/ui-tests
      - name: Native speech error regression (no microphone)
        run: scripts/test-speech-bridge
      # 3. unresolved-identifier scan (forgotten imports; also forbids
      #    xterm private ._core API in deck code) — an approximation, not a
      #    syntax check; that's what gate 1 is for
      - name: JS unresolved-identifier scan
        run: node app/ui/js/check.mjs

      - name: Release tooling fixtures
        run: python3 -m unittest scripts/test_release_tools.py

      - name: Workflow syntax and expression validation
        run: scripts/check-workflows

      # RustSec advisories against the committed lockfile. Last, so an
      # advisory published upstream never masks a real test failure — it
      # fails the build on its own line. Default severity: known
      # vulnerabilities fail; informational notices (unmaintained, unsound)
      # are reported without failing, so a transitive crate going unmaintained
      # does not block every PR.
      - name: cargo audit (RustSec advisories)
        run: cargo audit --file app/src-tauri/Cargo.lock
