name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # arm64 runner: the committed tmux sidecar the contract tests drive is
    # an aarch64 binary
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt
      - name: Install pinned coverage runner
        run: cargo install cargo-llvm-cov --version 0.8.5 --locked
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            app/src-tauri

      # both crates hold the same bar: fmt --check, clippy -D warnings, tests
      - name: cargo fmt (app backend)
        run: cargo fmt --all --check --manifest-path app/src-tauri/Cargo.toml
      - name: cargo fmt (status helper)
        run: cargo fmt --all --check --manifest-path app/status-helper/Cargo.toml

      - name: cargo clippy -D warnings (app backend)
        run: cargo clippy --all-targets --all-features --locked --manifest-path app/src-tauri/Cargo.toml -- -D warnings
      - name: cargo clippy -D warnings (status helper)
        run: cargo clippy --all-targets --all-features --locked --manifest-path app/status-helper/Cargo.toml -- -D warnings

      # single-threaded: tmux contract tests + storage/scheduler recovery
      # tests share process-wide state (throwaway tmux servers, env)
      - name: cargo test + coverage (app backend — unit, storage/scheduler recovery, log privacy, tmux contract)
        run: cargo llvm-cov --all-targets --all-features --locked --fail-under-lines 70 --fail-under-functions 70 --manifest-path app/src-tauri/Cargo.toml -- --test-threads=1
      # no coverage gate: a ~150-line sidecar whose main() is an OS boundary
      - name: cargo test (status helper)
        run: cargo test --locked --manifest-path app/status-helper/Cargo.toml

      # no-build frontend, three gates:
      # 1. real syntax check of every module (node --check)
      - name: JS syntax (node --check)
        run: |
          set -e
          for f in app/ui/js/*.js app/ui/js/i18n/*.js app/ui/js/*.mjs app/ui/test/*.mjs; do
            node --check "$f"
          done
      # 2. headless pure + production-module DOM tests (node:test, no npm).
      #    wk-smoke is environment-guarded here and executes only in WKWebView.
      - name: JS unit tests + coverage
        run: node --test --experimental-test-coverage --test-coverage-lines=70 --test-coverage-branches=70 --test-coverage-functions=70 app/ui/test/*.mjs
      # 3. unresolved-identifier scan (forgotten imports; also forbids
      #    xterm private ._core API in deck code) — an approximation, not a
      #    syntax check; that's what gate 1 is for
      - name: JS unresolved-identifier scan
        run: node app/ui/js/check.mjs

      - name: Release tooling fixtures
        run: python3 -m unittest scripts/test_release_tools.py

      - name: Workflow syntax and expression validation
        run: scripts/check-workflows
