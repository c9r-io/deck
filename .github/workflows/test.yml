name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # arm64 runner: the committed tmux sidecar the contract tests drive is
    # an aarch64 binary
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            app/src-tauri

      # formatting is enforced for the app backend; the legacy TUI crate
      # (src/) predates rustfmt adoption and reformatting it wholesale would
      # bury real diffs — enforce there if/when it gets touched again
      - name: cargo fmt (app backend)
        run: cargo fmt --check --manifest-path app/src-tauri/Cargo.toml

      - name: cargo clippy -D warnings (TUI crate)
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: cargo clippy -D warnings (app backend)
        run: cargo clippy --all-targets --locked --manifest-path app/src-tauri/Cargo.toml -- -D warnings

      - name: cargo test (TUI crate)
        run: cargo test --locked
      # single-threaded: tmux contract tests + storage/scheduler recovery
      # tests share process-wide state (throwaway tmux servers, env)
      - name: cargo test (app backend — unit, storage/scheduler recovery, log privacy, tmux contract)
        run: cargo test --locked --manifest-path app/src-tauri/Cargo.toml -- --test-threads=1

      # no-build frontend: every identifier in the ES modules must resolve
      # (catches forgotten imports before the webview does)
      - name: frontend module check
        run: node app/ui/js/check.mjs
