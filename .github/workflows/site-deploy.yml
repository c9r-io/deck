name: site-deploy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type deploy-deck.c9r.io after reviewing the local build and Cloudflare handoff checklist'
        required: true
        type: string

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    if: inputs.confirmation == 'deploy-deck.c9r.io'
    runs-on: ubuntu-latest
    environment: website-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test and build static site
        working-directory: site
        run: |
          npm test
          npm run build
      - name: Deploy to independent Cloudflare Pages project
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/dist --project-name=deck-site --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
