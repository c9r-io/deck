name: tunnel-helper

on:
  push:
    branches: [main]
    paths:
      - 'tools/deck-tunnelctl/**'
      - '.github/workflows/tunnel-helper.yml'
  pull_request:
    paths:
      - 'tools/deck-tunnelctl/**'
      - '.github/workflows/tunnel-helper.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: tools/deck-tunnelctl
      - name: cargo fmt
        run: cargo fmt --check --manifest-path tools/deck-tunnelctl/Cargo.toml
      - name: cargo clippy
        run: cargo clippy --all-targets --locked --manifest-path tools/deck-tunnelctl/Cargo.toml -- -D warnings
      - name: cargo test
        run: cargo test --all-targets --locked --manifest-path tools/deck-tunnelctl/Cargo.toml
