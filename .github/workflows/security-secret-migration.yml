name: security-secret-migration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Copy repository secrets into their fixed protected environments
        env:
          GH_TOKEN: ${{ secrets.SECRET_MIGRATION_ADMIN_TOKEN }}
          SOURCE_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          SOURCE_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SOURCE_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          SOURCE_APPLE_ID: ${{ secrets.APPLE_ID }}
          SOURCE_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          SOURCE_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SOURCE_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SOURCE_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          set_environment_secret() {
            environment=$1
            name=$2
            value=$3
            test -n "$value"
            printf '%s' "$value" | gh secret set "$name" \
              --env "$environment" --repo "$GITHUB_REPOSITORY"
          }

          for environment in production nightly; do
            set_environment_secret "$environment" APPLE_CERTIFICATE "$SOURCE_APPLE_CERTIFICATE"
            set_environment_secret "$environment" APPLE_CERTIFICATE_PASSWORD "$SOURCE_APPLE_CERTIFICATE_PASSWORD"
            set_environment_secret "$environment" APPLE_SIGNING_IDENTITY "$SOURCE_APPLE_SIGNING_IDENTITY"
            set_environment_secret "$environment" APPLE_ID "$SOURCE_APPLE_ID"
            set_environment_secret "$environment" APPLE_PASSWORD "$SOURCE_APPLE_PASSWORD"
            set_environment_secret "$environment" APPLE_TEAM_ID "$SOURCE_APPLE_TEAM_ID"
          done
          set_environment_secret website-production CLOUDFLARE_API_TOKEN "$SOURCE_CLOUDFLARE_API_TOKEN"
          set_environment_secret website-production CLOUDFLARE_ACCOUNT_ID "$SOURCE_CLOUDFLARE_ACCOUNT_ID"
