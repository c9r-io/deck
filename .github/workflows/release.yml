name: release

# Build, sign, and notarize the macOS app (Apple Silicon) for a strict Stable tag,
# then attach the .dmg and in-app-updater artifacts to a GitHub Release.
# Triggers:
#   1. tag push          — the normal path
#   2. schedule (hourly) — resilience: builds the newest v* tag that has no
#                          release yet (covers platform event-delivery outages)
#   3. workflow_dispatch — manual fallback or surgical DMG repair

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      repair_dmg_tag:
        description: 'Existing release tag whose DMG should be notarized, stapled, and replaced'
        required: false
        type: string

permissions:
  contents: write

jobs:
  resolve:
    if: github.event_name != 'workflow_dispatch' || inputs.repair_dmg_tag == ''
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      version: ${{ steps.pick.outputs.version }}
      sha: ${{ steps.pick.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            pushed_tag=${GITHUB_REF#refs/tags/}
            if [[ ! "$pushed_tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              echo "non-Stable tag ignored"
              echo "tag=" >> "$GITHUB_OUTPUT"
              echo "version=" >> "$GITHUB_OUTPUT"
              echo "sha=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            version=${pushed_tag#v}
            commit=$(git rev-parse "refs/tags/$pushed_tag^{commit}")
            if git tag --points-at "$commit" --list 'nightly-v*' | \
                 grep -Eq '^nightly-v[0-9]+\.[0-9]+\.[0-9]+-[0-9]{8}-[0-9a-f]{7,40}$'; then
              echo "Stable tag points at a Nightly candidate; promotion owns this release"
              echo "tag=" >> "$GITHUB_OUTPUT"
              echo "version=" >> "$GITHUB_OUTPUT"
              echo "sha=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if gh release view "$pushed_tag" -R "$GITHUB_REPOSITORY" \
                 --json assets,isDraft,isPrerelease \
                 --jq 'select((.isDraft | not) and (.isPrerelease | not)) | .assets[].name' \
                 2>/dev/null | grep -qx latest.json; then
              echo "complete release for $pushed_tag exists; no rebuild or overwrite"
              echo "tag=" >> "$GITHUB_OUTPUT"
              echo "version=" >> "$GITHUB_OUTPUT"
              echo "sha=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if gh release view "$pushed_tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "incomplete release for $pushed_tag requires ownership/provenance inspection; leaving it untouched"
              echo "tag=" >> "$GITHUB_OUTPUT"
              echo "version=" >> "$GITHUB_OUTPUT"
              echo "sha=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "tag=$pushed_tag" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "sha=$commit" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest=$(git tag -l 'v*' --sort=-v:refname | \
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          if [ -z "$latest" ]; then
            echo "no Stable tags"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # a release is only complete when the updater manifest made it up —
          # a build that dies mid-upload leaves a partial release behind
          if gh release view "$latest" -R "$GITHUB_REPOSITORY" \
               --json assets,isDraft,isPrerelease \
               --jq 'select((.isDraft | not) and (.isPrerelease | not)) | .assets[].name' \
               2>/dev/null | grep -qx 'latest.json'; then
            echo "complete release for $latest exists"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "sha=" >> "$GITHUB_OUTPUT"
          else
            if gh release view "$latest" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "incomplete release for $latest requires ownership/provenance inspection; leaving it untouched"
              echo "tag=" >> "$GITHUB_OUTPUT"
              echo "version=" >> "$GITHUB_OUTPUT"
              echo "sha=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "will build $latest"
            echo "tag=$latest" >> "$GITHUB_OUTPUT"
            echo "version=${latest#v}" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse "refs/tags/$latest^{commit}")" >> "$GITHUB_OUTPUT"
          fi

  build-macos:
    needs: resolve
    if: needs.resolve.outputs.tag != ''
    runs-on: macos-latest # Apple Silicon
    environment: production
    concurrency:
      group: stable-release-v${{ needs.resolve.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('app/src-tauri/Cargo.lock') }}

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Developer ID signing (identity: han chen / Y8ZG3D692W)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Notarization (Apple ID + app-specific password)
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # In-app updater artifact signing (minisign)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          DECK_BUILD_COMMIT: ${{ needs.resolve.outputs.sha }}
        with:
          projectPath: app
          tagName: ${{ needs.resolve.outputs.tag }}
          releaseName: 'deck ${{ needs.resolve.outputs.tag }}'
          releaseBody: |
            macOS (Apple Silicon) build, signed and notarized with a Developer ID
            certificate — no Gatekeeper prompts.
          releaseDraft: true
          prerelease: false

      - name: Verify app, helper, UUIDs, and Local Network usage metadata
        run: |
          set -euo pipefail
          app_path=app/src-tauri/target/release/bundle/macos/deck.app
          test -d "$app_path"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app_path/Contents/Info.plist")" = io.c9r.deck
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSLocalNetworkUsageDescription' "$app_path/Contents/Info.plist")" = \
            "Shell commands, CLIs, and agents launched or restored by deck can access devices and services on your local network."
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_path/Contents/Info.plist")
          test -f "$app_path/Contents/MacOS/$executable"
          test -f "$app_path/Contents/MacOS/tmux"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          codesign --verify --strict --verbose=2 "$app_path/Contents/MacOS/tmux"
          test "$(dwarfdump --uuid "$app_path/Contents/MacOS/$executable" | wc -l | tr -d ' ')" = 1
          test "$(dwarfdump --uuid "$app_path/Contents/MacOS/tmux" | wc -l | tr -d ' ')" = 1

      # Tauri notarizes/staples deck.app before creating the DMG, then signs
      # the final DMG. Submit that final carrier separately so Gatekeeper can
      # validate both the downloaded image and the app inside it.
      - name: Notarize, staple, and replace DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          trap 'gh release delete-asset "$RELEASE_TAG" latest.json -R "$GITHUB_REPOSITORY" -y || true' ERR
          mkdir updater-manifest
          gh release download "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" \
            --pattern latest.json --dir updater-manifest
          gh release delete-asset "$RELEASE_TAG" latest.json -R "$GITHUB_REPOSITORY" -y
          dmg=(app/src-tauri/target/release/bundle/dmg/*.dmg)
          test "${#dmg[@]}" -eq 1
          codesign --verify --verbose=2 "${dmg[0]}"
          xcrun notarytool submit "${dmg[0]}" \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "${dmg[0]}"
          xcrun stapler validate "${dmg[0]}"
          spctl -a -vv -t install "${dmg[0]}"
          gh release upload "$RELEASE_TAG" "${dmg[0]}" \
            -R "$GITHUB_REPOSITORY" --clobber
          gh release upload "$RELEASE_TAG" updater-manifest/latest.json \
            -R "$GITHUB_REPOSITORY"
          gh release edit "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" \
            --draft=false --prerelease=false
          trap - ERR

  repair-dmg:
    if: github.event_name == 'workflow_dispatch' && inputs.repair_dmg_tag != ''
    runs-on: macos-latest
    environment: production
    concurrency:
      group: stable-release-${{ inputs.repair_dmg_tag }}
      cancel-in-progress: false
    steps:
      - name: Download, notarize, staple, and replace published DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          RELEASE_TAG: ${{ inputs.repair_dmg_tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mkdir artifact
          gh release download "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" \
            --pattern '*.dmg' --dir artifact
          dmg=(artifact/*.dmg)
          test "${#dmg[@]}" -eq 1
          codesign --verify --verbose=2 "${dmg[0]}"
          xcrun notarytool submit "${dmg[0]}" \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "${dmg[0]}"
          xcrun stapler validate "${dmg[0]}"
          spctl -a -vv -t install "${dmg[0]}"
          gh release upload "$RELEASE_TAG" "${dmg[0]}" \
            -R "$GITHUB_REPOSITORY" --clobber
