name: release

# Build, sign, and notarize the macOS app (Apple Silicon) for a v* tag,
# then attach the .dmg and in-app-updater artifacts to a GitHub Release.
# Triggers:
#   1. tag push          — the normal path
#   2. schedule (hourly) — resilience: builds the newest v* tag that has no
#                          release yet (covers platform event-delivery outages)
#   3. workflow_dispatch — manual fallback or surgical DMG repair

on:
  push:
    tags:
      - 'v*'
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      repair_dmg_tag:
        description: 'Existing release tag whose DMG should be notarized, stapled, and replaced'
        required: false
        type: string

permissions:
  contents: write

jobs:
  resolve:
    if: github.event_name != 'workflow_dispatch' || inputs.repair_dmg_tag == ''
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest=$(git tag -l 'v*' --sort=-v:refname | head -1)
          if [ -z "$latest" ]; then
            echo "no v* tags"; echo "tag=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # a release is only complete when the updater manifest made it up —
          # a build that dies mid-upload leaves a partial release behind
          if gh release view "$latest" -R "$GITHUB_REPOSITORY" --json assets \
               --jq '.assets[].name' 2>/dev/null | grep -qx 'latest.json'; then
            echo "complete release for $latest exists"; echo "tag=" >> "$GITHUB_OUTPUT"
          else
            if gh release view "$latest" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "incomplete release for $latest — deleting so the build recreates it"
              gh release delete "$latest" -R "$GITHUB_REPOSITORY" --yes
            fi
            echo "will build $latest"; echo "tag=$latest" >> "$GITHUB_OUTPUT"
          fi

  build-macos:
    needs: resolve
    if: needs.resolve.outputs.tag != ''
    runs-on: macos-latest # Apple Silicon
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('app/src-tauri/Cargo.lock') }}

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Developer ID signing (identity: han chen / Y8ZG3D692W)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Notarization (Apple ID + app-specific password)
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # In-app updater artifact signing (minisign)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ needs.resolve.outputs.tag }}
          releaseName: 'deck ${{ needs.resolve.outputs.tag }}'
          releaseBody: |
            macOS (Apple Silicon) build, signed and notarized with a Developer ID
            certificate — no Gatekeeper prompts.
          releaseDraft: false
          prerelease: false

      # Tauri notarizes/staples deck.app before creating the DMG, then signs
      # the final DMG. Submit that final carrier separately so Gatekeeper can
      # validate both the downloaded image and the app inside it.
      - name: Notarize, staple, and replace DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          trap 'gh release delete-asset "$RELEASE_TAG" latest.json -R "$GITHUB_REPOSITORY" -y || true' ERR
          dmg=(app/src-tauri/target/release/bundle/dmg/*.dmg)
          test "${#dmg[@]}" -eq 1
          codesign --verify --verbose=2 "${dmg[0]}"
          xcrun notarytool submit "${dmg[0]}" \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "${dmg[0]}"
          xcrun stapler validate "${dmg[0]}"
          spctl -a -vv -t install "${dmg[0]}"
          gh release upload "$RELEASE_TAG" "${dmg[0]}" \
            -R "$GITHUB_REPOSITORY" --clobber
          trap - ERR

  repair-dmg:
    if: github.event_name == 'workflow_dispatch' && inputs.repair_dmg_tag != ''
    runs-on: macos-latest
    steps:
      - name: Download, notarize, staple, and replace published DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          RELEASE_TAG: ${{ inputs.repair_dmg_tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          trap 'gh release delete-asset "$RELEASE_TAG" latest.json -R "$GITHUB_REPOSITORY" -y || true' ERR
          mkdir artifact
          gh release download "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" \
            --pattern '*.dmg' --dir artifact
          dmg=(artifact/*.dmg)
          test "${#dmg[@]}" -eq 1
          codesign --verify --verbose=2 "${dmg[0]}"
          xcrun notarytool submit "${dmg[0]}" \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "${dmg[0]}"
          xcrun stapler validate "${dmg[0]}"
          spctl -a -vv -t install "${dmg[0]}"
          gh release upload "$RELEASE_TAG" "${dmg[0]}" \
            -R "$GITHUB_REPOSITORY" --clobber
          trap - ERR
