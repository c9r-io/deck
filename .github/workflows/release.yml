name: release

# Build, sign, and notarize the macOS app (Apple Silicon) for a v* tag,
# then attach the .dmg and in-app-updater artifacts to a GitHub Release.
# Triggers:
#   1. tag push          — the normal path
#   2. schedule (hourly) — resilience: builds the newest v* tag that has no
#                          release yet (covers platform event-delivery outages)
#   3. workflow_dispatch — manual fallback, same resolve logic

on:
  push:
    tags:
      - 'v*'
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest=$(git tag -l 'v*' --sort=-v:refname | head -1)
          if [ -z "$latest" ]; then
            echo "no v* tags"; echo "tag=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if gh release view "$latest" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release for $latest already exists"; echo "tag=" >> "$GITHUB_OUTPUT"
          else
            echo "will build $latest"; echo "tag=$latest" >> "$GITHUB_OUTPUT"
          fi

  build-macos:
    needs: resolve
    if: needs.resolve.outputs.tag != ''
    runs-on: macos-latest # Apple Silicon
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('app/src-tauri/Cargo.lock') }}

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Developer ID signing (identity: han chen / Y8ZG3D692W)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Notarization (Apple ID + app-specific password)
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # In-app updater artifact signing (minisign)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ needs.resolve.outputs.tag }}
          releaseName: 'deck ${{ needs.resolve.outputs.tag }}'
          releaseBody: |
            macOS (Apple Silicon) build, signed and notarized with a Developer ID
            certificate — no Gatekeeper prompts.
          releaseDraft: false
          prerelease: false
