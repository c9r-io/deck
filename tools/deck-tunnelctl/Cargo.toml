[package]
name = "deck-tunnelctl"
version = "0.1.0"
edition = "2021"
description = "Optional, isolated Deck Secure Tunnel lifecycle helper"
license = "MIT"

[dependencies]
core-foundation = "0.10"
libc = "0.2"
security-framework = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
