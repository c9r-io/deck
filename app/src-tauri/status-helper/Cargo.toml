[package]
name = "deck-status-helper"
version = "0.1.0"
edition = "2021"
description = "deck — tiny agent-hook forwarder (writes one status line to deck's local socket)"
license = "MIT"

# Minimal on purpose: the binary runs inside the user's tmux panes
# (spawned by agent hooks), so it must stay small, offline, and must never
# link the deck app itself. Its one dependency is serde/serde_json (already
# locked and audited for the workspace): reading the single allowlisted
# interaction id out of an untrusted hook payload needs a correct JSON
# parser — escapes, unicode, nesting, duplicates, malformed input — and a
# hand-written scanner would have been one (FR-SI-04). It is a member of the
# app/src-tauri workspace only to share the lock file and the CI gates; the
# release profile (lto, strip) comes from that workspace root, and build.rs
# there builds this crate as a sidecar with its own --target-dir.

[dependencies]
serde = "1"
serde_json = "1"
