[package]
name = "deck-app"
version = "0.2.3"
edition = "2021"
description = "deck — kanban for terminal agent sessions (Tauri app)"
license = "MIT"

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
base64 = "0.22"
portable-pty = "0.8"

[profile.release]
lto = true
strip = true
