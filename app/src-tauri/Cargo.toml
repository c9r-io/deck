[package]
name = "deck-app"
version = "0.7.16"
edition = "2021"
description = "deck — kanban for terminal agent sessions (Tauri app)"
license = "MIT"

# One workspace for the app and signed sidecars: one Cargo.lock and one
# fmt/clippy/test invocation in CI. Each sidecar remains a separate package;
# build.rs uses isolated target dirs before tauri_build runs.
[workspace]
members = ["status-helper", "mcp-runner", "mcp-adapter"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
core-foundation = "0.10"
libc = "0.2"
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
# The updater plugin's own installer runs an admin AppleScript when the
# bundle is not writable and a PATH `touch` on success; deck uses only its
# check/download/verify half and unpacks the verified archive itself with
# the same two crates the plugin already brought in (tests/edr_quiet.rs).
flate2 = "1"
tar = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
base64 = "0.22"
portable-pty = "0.8"
unicode-segmentation = "1"
unicode-width = "0.2"
regex = "1"
sha2 = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
tungstenite = { version = "0.28", default-features = false, features = ["handshake", "rustls-tls-native-roots"] }
security-framework = "3"
rustls = { version = "0.23.45", default-features = false, features = ["ring"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rcgen = "0.14"
ring = "0.17"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
subtle = "2"

[dev-dependencies]
tauri = { version = "2", default-features = false, features = ["test"] }

[profile.release]
lto = true
strip = true
