[package]
name = "deck-app"
version = "0.5.14"
edition = "2021"
description = "deck — kanban for terminal agent sessions (Tauri app)"
license = "MIT"

# One workspace for both crates: one Cargo.lock, one target dir, one
# fmt/clippy/test/coverage invocation in CI. The status helper stays a
# separate zero-dependency package (it never links deck-app); build.rs still
# builds it as a sidecar with its own --target-dir before tauri_build runs.
[workspace]
members = ["status-helper"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
libc = "0.2"
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
base64 = "0.22"
portable-pty = "0.8"
unicode-segmentation = "1"
unicode-width = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
tungstenite = { version = "0.28", default-features = false, features = ["handshake", "rustls-tls-native-roots"] }
security-framework = "3"
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[dev-dependencies]
tauri = { version = "2", default-features = false, features = ["test"] }

[profile.release]
lto = true
strip = true
