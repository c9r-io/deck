<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>deck — session board</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #101318;
    --panel: #171b22;
    --raised: #1e242e;
    --hover: #232b37;
    --border: #2a3140;
    --border-soft: #222834;
    --text: #dce3ec;
    --muted: #7e8a9a;
    --faint: #566072;
    --accent: #4fd6be;
    --accent-dim: #2a6e62;
    --run: #41d392;
    --wait: #e8b45a;
    --stop: #566072;
    --danger: #e06c75;
    --sel: rgba(79, 214, 190, 0.10);
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --radius: 8px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 13px;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  button:focus-visible, input:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }
  input {
    font: inherit; color: var(--text);
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 6px; padding: 7px 10px; width: 100%;
  }
  input::placeholder { color: var(--faint); }

  /* ---------- app frame ---------- */
  #app { display: flex; height: 100%; }

  /* ---------- sidebar ---------- */
  #sidebar {
    width: 232px; flex: none;
    background: var(--panel);
    border-right: 1px solid var(--border-soft);
    display: flex; flex-direction: column;
    user-select: none;
    transition: width 0.16s ease;
    overflow: hidden;
  }
  .side-top {
    display: flex; align-items: center; gap: 8px;
    padding: 14px 10px 10px 14px;
  }
  .wordmark {
    font-family: var(--mono); font-size: 15px; font-weight: 600;
    letter-spacing: 0.02em; flex: 1; white-space: nowrap;
  }
  .wordmark .glyph { color: var(--accent); }
  .wordmark .sub { color: var(--faint); font-size: 10px; font-weight: 400; }
  .collapse-btn {
    padding: 5px 7px; border-radius: 6px; color: var(--faint);
    flex: none;
  }
  .collapse-btn:hover { background: var(--hover); color: var(--text); }
  .side-home {
    margin: 0 10px 6px;
    display: flex; align-items: center; gap: 8px;
    padding: 7px 10px; border-radius: 6px;
    color: var(--text); white-space: nowrap;
  }
  .side-home:hover { background: var(--hover); }
  .side-home.active { background: var(--sel); color: var(--accent); }
  .side-group {
    padding: 12px 14px 4px;
    font-size: 10px; font-weight: 600; letter-spacing: 0.09em;
    text-transform: uppercase; color: var(--faint);
    display: flex; justify-content: space-between; white-space: nowrap;
  }
  .side-list { overflow-y: auto; flex: 1; padding-bottom: 8px; }
  .side-item {
    display: flex; align-items: center; gap: 8px;
    margin: 1px 10px; padding: 6px 10px;
    border-radius: 6px; cursor: pointer;
    color: var(--text); white-space: nowrap;
  }
  .side-item:hover { background: var(--hover); }
  .side-item.active { background: var(--sel); }
  .side-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .side-item .col-tag { font-size: 10px; color: var(--faint); }
  .side-new {
    margin: 10px; padding: 8px 10px;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    border: 1px dashed var(--border); border-radius: 6px;
    color: var(--muted); white-space: nowrap;
  }
  .side-new:hover { color: var(--accent); border-color: var(--accent-dim); }

  /* collapsed sidebar: a thin rail of dots */
  body.side-collapsed #sidebar { width: 50px; }
  body.side-collapsed .side-top { padding: 14px 0 10px; justify-content: center; }
  body.side-collapsed .wordmark { display: none; }
  body.side-collapsed .side-home { justify-content: center; padding: 7px 0; margin: 0 8px 6px; }
  body.side-collapsed .side-home .label { display: none; }
  body.side-collapsed .side-group { display: none; }
  body.side-collapsed .side-item { justify-content: center; padding: 8px 0; margin: 1px 8px; }
  body.side-collapsed .side-item .name, body.side-collapsed .side-item .col-tag { display: none; }
  body.side-collapsed .side-new { padding: 8px 0; margin: 8px; }
  body.side-collapsed .side-new .label { display: none; }

  /* status dot */
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--stop); }
  .dot.running { background: var(--run); box-shadow: 0 0 6px rgba(65, 211, 146, 0.55); }
  .dot.waiting { background: var(--wait); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.35; } }
  @media (prefers-reduced-motion: reduce) {
    .dot.waiting { animation: none; }
    * { transition: none !important; }
  }

  /* ---------- main ---------- */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  /* ---------- project tabs ---------- */
  #tabs {
    display: flex; align-items: flex-end; gap: 2px;
    padding: 8px 14px 0;
    background: var(--panel);
    border-bottom: 1px solid var(--border-soft);
    user-select: none;
    overflow-x: auto;
  }
  .tab {
    display: flex; align-items: center; gap: 7px;
    padding: 7px 14px 8px;
    border: 1px solid transparent; border-bottom: none;
    border-radius: 8px 8px 0 0;
    color: var(--muted); white-space: nowrap;
    cursor: pointer; position: relative; top: 1px;
    max-width: 220px;
  }
  .tab:hover { color: var(--text); background: var(--hover); }
  .tab.active {
    color: var(--text); background: var(--bg);
    border-color: var(--border-soft);
    font-weight: 600;
  }
  .tab .name { overflow: hidden; text-overflow: ellipsis; }
  .tab .wait-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--wait); animation: pulse 1.6s ease-in-out infinite; }
  .tab input { padding: 1px 6px; font-size: 13px; width: 110px; background: var(--raised); }
  .tab-add {
    padding: 6px 10px 8px; color: var(--faint); border-radius: 8px 8px 0 0;
    flex: none;
  }
  .tab-add:hover { color: var(--accent); background: var(--hover); }

  /* ---------- board view ---------- */
  #board-view { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .board-head {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 20px 10px;
  }
  .board-head h1 {
    font-size: 15px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 40%;
  }
  .board-head .hint {
    color: var(--faint); font-size: 12px; margin-left: auto;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    min-width: 0;
  }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px; border-radius: 6px;
    background: var(--raised); border: 1px solid var(--border);
    color: var(--text); white-space: nowrap;
  }
  .btn:hover { background: var(--hover); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #0b201c; font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.danger:hover { border-color: var(--danger); color: var(--danger); }

  #columns {
    flex: 1; display: flex; gap: 12px;
    padding: 4px 20px 20px; overflow-x: auto; min-height: 0;
  }
  .column {
    flex: 1; min-width: 200px; max-width: 320px;
    display: flex; flex-direction: column;
    background: var(--panel);
    border: 1px solid var(--border-soft); border-radius: 10px;
    min-height: 0;
  }
  .column.drop-target { border-color: var(--accent-dim); background: #182028; }
  .col-head {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px 8px;
    font-size: 11px; font-weight: 600; letter-spacing: 0.07em;
    text-transform: uppercase; color: var(--muted);
  }
  .col-head .col-name { cursor: text; }
  .col-head .count {
    font-family: var(--mono); font-size: 10px; color: var(--faint);
    background: var(--raised); border-radius: 8px; padding: 1px 7px;
  }
  .col-head input {
    padding: 2px 6px; font-size: 11px; letter-spacing: 0.07em;
    text-transform: uppercase; background: var(--raised); width: 120px;
  }
  .col-del {
    margin-left: auto; padding: 1px 6px; border-radius: 4px;
    color: transparent; font-size: 13px; line-height: 1;
  }
  .column:hover .col-del { color: var(--faint); }
  .col-del:hover { color: var(--danger) !important; background: var(--hover); }
  .col-cards { flex: 1; overflow-y: auto; padding: 2px 8px 10px; display: flex; flex-direction: column; gap: 8px; }

  .col-ghost {
    flex: none; width: 150px;
    display: flex; align-items: flex-start;
  }
  .col-ghost button {
    width: 100%; padding: 10px;
    border: 1px dashed var(--border); border-radius: 10px;
    color: var(--faint); font-size: 12px;
  }
  .col-ghost button:hover { color: var(--accent); border-color: var(--accent-dim); }

  .card {
    background: var(--raised);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 12px;
    cursor: pointer;
    transition: border-color 0.12s, transform 0.12s;
  }
  .card:hover { border-color: #3a4356; }
  .card.waiting { border-color: rgba(232, 180, 90, 0.45); }
  .card.waiting:hover { border-color: rgba(232, 180, 90, 0.7); }
  .card.dragging { opacity: 0.45; }
  .card-top { display: flex; align-items: center; gap: 8px; }
  .card-title { font-weight: 600; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mem-chip {
    font-family: var(--mono); font-size: 10px; color: var(--faint);
    background: var(--panel); border: 1px solid var(--border-soft);
    border-radius: 4px; padding: 1px 5px; flex: none;
    font-variant-numeric: tabular-nums;
  }
  .mem-chip:empty { display: none; }
  .mem-chip.high { color: var(--wait); border-color: rgba(232, 180, 90, 0.35); }
  .sess-head .mem-chip { font-size: 11px; padding: 2px 7px; background: var(--raised); border-color: var(--border); }
  .card-meta {
    margin-top: 5px; display: flex; gap: 8px; align-items: baseline;
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    white-space: nowrap; overflow: hidden;
  }
  .card-meta .cmd { color: var(--accent); flex: none; }
  .card-meta .dir { overflow: hidden; text-overflow: ellipsis; color: var(--faint); }
  .card-desc {
    margin-top: 5px; font-size: 11.5px; line-height: 1.4; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card-desc input { padding: 2px 6px; font-size: 11.5px; background: var(--panel); }
  .card-tail {
    margin-top: 8px; padding: 7px 9px;
    background: var(--bg); border-radius: 6px;
    font-family: var(--mono); font-size: 11px; line-height: 1.5;
    color: var(--muted);
    white-space: nowrap; overflow: hidden;
  }
  .card-tail div { overflow: hidden; text-overflow: ellipsis; }
  .card-tail .wait-line { color: var(--wait); }
  .card-actions { margin-top: 8px; display: none; gap: 6px; }
  .card:hover .card-actions { display: flex; }
  .chip-btn {
    font-size: 11px; padding: 3px 9px; border-radius: 5px;
    background: var(--panel); border: 1px solid var(--border);
    color: var(--muted);
  }
  .chip-btn:hover { color: var(--text); border-color: var(--faint); }
  .chip-btn.accent:hover { color: var(--accent); border-color: var(--accent-dim); }
  .chip-btn.danger:hover { color: var(--danger); border-color: var(--danger); }

  /* ---------- session view ---------- */
  #session-view { flex: 1; display: none; flex-direction: column; min-height: 0; }
  .sess-head {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border-soft);
    background: var(--panel);
  }
  .back-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 10px; border-radius: 6px; color: var(--muted);
  }
  .back-btn:hover { background: var(--hover); color: var(--text); }
  .sess-title { font-weight: 600; display: flex; align-items: center; gap: 8px; min-width: 0; }
  .sess-title .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sess-path { font-family: var(--mono); font-size: 11px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sess-spacer { flex: 1; min-width: 12px; }
  .col-select {
    font-size: 12px; color: var(--muted);
    background: var(--raised); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 8px; font-family: var(--sans);
  }
  #terminal {
    flex: 1; overflow-y: auto;
    padding: 14px 18px 8px;
    font-family: var(--mono); font-size: 12.5px; line-height: 1.65;
    background: var(--bg);
  }
  #terminal .t-line { white-space: pre-wrap; word-break: break-word; }
  #terminal .t-link {
    text-decoration: underline dotted; text-underline-offset: 3px;
    text-decoration-color: var(--faint);
    cursor: pointer; border-radius: 3px;
  }
  #terminal .t-link:hover { color: var(--accent); text-decoration-color: var(--accent); background: var(--sel); }
  #terminal .t-dim { color: var(--muted); }
  #terminal .t-accent { color: var(--accent); }
  #terminal .t-wait { color: var(--wait); }
  #terminal .t-err { color: var(--danger); }
  .term-input-row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 18px 14px;
    background: var(--bg);
  }
  .term-input-row .prompt { font-family: var(--mono); color: var(--accent); }
  .term-input-row input {
    background: var(--panel); border-color: var(--border);
    font-family: var(--mono); font-size: 12.5px;
  }

  /* ---------- context menu ---------- */
  #ctx {
    position: fixed; z-index: 50; display: none;
    min-width: 180px;
    max-height: min(70vh, 480px); overflow-y: auto;
    background: var(--raised); border: 1px solid var(--border);
    border-radius: 8px; padding: 5px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
  }
  #ctx button, #ctx .ctx-label {
    display: block; width: 100%; text-align: left;
    padding: 7px 10px; border-radius: 5px; font-size: 12.5px;
  }
  #ctx button:hover { background: var(--hover); }
  #ctx button.danger:hover { color: var(--danger); }
  #ctx .ctx-label { color: var(--faint); font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; padding-bottom: 3px; }
  #ctx .ctx-value {
    display: block; font-family: var(--mono); font-size: 11px; color: var(--faint);
    padding: 6px 10px 4px; max-width: 280px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #ctx hr { border: none; border-top: 1px solid var(--border-soft); margin: 4px 2px; }

  /* ---------- modal ---------- */
  #overlay {
    position: fixed; inset: 0; z-index: 40; display: none;
    background: rgba(8, 10, 13, 0.6);
    align-items: flex-start; justify-content: center;
  }
  #modal {
    margin-top: 12vh; width: 440px; max-width: calc(100vw - 40px);
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px;
    box-shadow: 0 16px 48px rgba(0, 0, 0, 0.55);
  }
  #modal h2 { font-size: 14px; margin-bottom: 16px; }
  .field { margin-bottom: 14px; }
  .field label {
    display: block; font-size: 11px; color: var(--muted);
    margin-bottom: 5px; letter-spacing: 0.04em;
  }
  .preset-row { display: flex; gap: 6px; margin-top: 7px; }
  .preset {
    font-family: var(--mono); font-size: 11px;
    padding: 3px 10px; border-radius: 12px;
    border: 1px solid var(--border); color: var(--muted);
  }
  .preset:hover, .preset.on { color: var(--accent); border-color: var(--accent-dim); background: var(--sel); }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }

  /* ---------- toast ---------- */
  #toasts { position: fixed; bottom: 18px; right: 18px; z-index: 60; display: flex; flex-direction: column; gap: 8px; }
  .toast {
    background: var(--raised); border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 8px; padding: 9px 14px;
    font-size: 12.5px; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
    animation: toast-in 0.18s ease-out;
  }
  @keyframes toast-in { from { transform: translateY(8px); opacity: 0; } }

  #tabs::-webkit-scrollbar { height: 5px; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; border: 2px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
<div id="app">
  <nav id="sidebar">
    <div class="side-top">
      <div class="wordmark"><span class="glyph">▞</span> deck <span class="sub">GUI mock</span></div>
      <button class="collapse-btn" id="collapse-btn" title="Collapse sidebar (⌘B)">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M10 3 5 8l5 5"/></svg>
      </button>
    </div>
    <button class="side-home active" id="home-btn" title="Board">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="2.5" width="3.4" height="11"/><rect x="6.3" y="2.5" width="3.4" height="7"/><rect x="11.1" y="2.5" width="3.4" height="9"/></svg>
      <span class="label">Board</span>
    </button>
    <div class="side-group"><span>Sessions</span><span id="side-count"></span></div>
    <div class="side-list" id="side-list"></div>
    <button class="side-new" id="side-new" title="New session"><span>＋</span><span class="label">New session</span></button>
  </nav>

  <div id="main">
    <div id="tabs"></div>

    <div id="board-view">
      <div class="board-head">
        <h1 id="board-title">Sessions</h1>
        <button class="btn primary" id="board-new">＋ New session</button>
        <span class="hint">drag cards between boards · double-click a board name to rename · right-click for actions</span>
      </div>
      <div id="columns"></div>
    </div>

    <div id="session-view">
      <div class="sess-head">
        <button class="back-btn" id="back-btn" title="Back to board (Esc)">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 3 5 8l5 5"/></svg>
          Board
        </button>
        <span class="dot" id="sess-dot"></span>
        <div class="sess-title"><span class="name" id="sess-name"></span></div>
        <span class="sess-path" id="sess-path"></span>
        <div class="sess-spacer"></div>
        <span class="mem-chip" id="sess-mem" title="Memory of the whole session process tree: shell + agent + spawned children (mock values)"></span>
        <select class="col-select" id="sess-col" title="Move to board"></select>
        <button class="btn" id="sess-new-here" title="New session in this directory">＋ Here</button>
        <button class="btn danger" id="sess-close" title="Close session (terminates the shell and removes the card)">Close</button>
      </div>
      <div id="terminal"></div>
      <div class="term-input-row" id="term-input-row">
        <span class="prompt">❯</span>
        <input id="term-input" placeholder="type to the agent… (mock: echoes and resumes output)" autocomplete="off" spellcheck="false">
      </div>
    </div>
  </div>
</div>

<div id="ctx"></div>
<div id="overlay">
  <div id="modal">
    <h2 id="modal-title">New session</h2>
    <div class="field">
      <label for="f-title">Title</label>
      <input id="f-title" placeholder="fix flaky orchestrator test">
    </div>
    <div class="field">
      <label for="f-cmd">Command</label>
      <input id="f-cmd" value="claude" spellcheck="false" style="font-family:var(--mono);font-size:12px">
      <div class="preset-row" id="preset-row">
        <button class="preset on" data-cmd="claude">claude</button>
        <button class="preset" data-cmd="codex">codex</button>
        <button class="preset" data-cmd="">shell</button>
      </div>
    </div>
    <div class="field">
      <label for="f-dir">Directory</label>
      <input id="f-dir" spellcheck="false" style="font-family:var(--mono);font-size:12px">
    </div>
    <div class="modal-actions">
      <button class="btn" id="m-cancel">Cancel</button>
      <button class="btn" id="m-create">Create only</button>
      <button class="btn primary" id="m-open">Create &amp; open</button>
    </div>
  </div>
</div>
<div id="toasts"></div>

<script>
'use strict';
/* ================================================================
   deck GUI prototype — mock only.
   `MockProvider` is the seam where a real backend (WebSocket + PTY
   or a tmux bridge) plugs in; everything else is UI.
   ================================================================ */

const HOME = '~/c9r-io';

/* ---------- mock provider ---------- */
function MockProvider() {
  let nextId = 1;
  const id = p => p + nextId++;
  const projects = new Map();  // id -> {id, name, columns: [{id, name}]}
  const sessions = new Map();  // id -> session
  const listeners = new Set();
  const emit = (ev, x) => listeners.forEach(fn => fn(ev, x));

  const CLAUDE_LINES = [
    ['dim', '⏺ Read src/scheduler.rs (412 lines)'],
    ['dim', '⏺ Grep "retry_backoff" → 7 matches in 3 files'],
    ['text', '  The flake comes from a shared tempdir between test cases.'],
    ['dim', '⏺ Edit crates/core/src/worker.rs'],
    ['dim', '⏺ Bash cargo test -p orchestrator-core'],
    ['text', '  running 84 tests … ok. 0 failed, 2 ignored'],
    ['accent', '✳ Compacting context…'],
    ['text', '  Next I\'ll isolate the tempdir per test and re-run the suite.'],
    ['dim', '⏺ Bash cargo clippy --workspace'],
    ['text', '  warning: unused variable `attempt` — fixing.'],
    ['dim', '⏺ WebFetch https://docs.c9r.io/guide/01-quickstart'],
    ['text', '  The manifest format is documented in docs/guide/01-quickstart.md.'],
  ];
  const CODEX_LINES = [
    ['dim', '› exploring repository structure'],
    ['dim', '› running: pytest tests/ -x -q'],
    ['text', '  12 passed, 1 skipped in 4.2s'],
    ['text', '  Applying patch to gui/settings.py'],
    ['dim', '› running: ruff check . --fix'],
  ];
  const SHELL_LINES = [
    ['dim', '$ git status'],
    ['text', 'On branch main — nothing to commit, working tree clean'],
  ];

  const linesFor = s =>
    s.cmd.startsWith('claude') ? CLAUDE_LINES :
    s.cmd.startsWith('codex') ? CODEX_LINES : SHELL_LINES;

  /* No automatic card movement anywhere: the board surfaces information
     (status dots, waiting highlights) and leaves every placement decision
     to the user. */

  function pushLine(s, kind, text) {
    s.buffer.push({ kind, text });
    if (s.buffer.length > 500) s.buffer.shift();
    emit('output', s);
  }

  function tick(s) {
    if (s.status !== 'running') return;
    const pool = linesFor(s);
    const [kind, text] = pool[s.cursor % pool.length];
    s.cursor++;
    pushLine(s, kind, text);
    if (s.cmd && s.cursor % 9 === 0) {
      s.status = 'waiting';
      pushLine(s, 'wait', '⧗ Waiting for your input — approve the plan? (y/n)');
      emit('status', s);
      return;
    }
    s.timer = setTimeout(() => tick(s), 900 + Math.random() * 1800);
  }

  function start(s) {
    if (!s || s.status === 'running' || s.status === 'waiting') return;
    s.status = 'running';
    /* mock baseline: agent runtimes are heavy, a bare shell is not */
    s.mem = s.cmd.startsWith('claude') ? 550 + Math.random() * 350
          : s.cmd.startsWith('codex') ? 300 + Math.random() * 200
          : 5 + Math.random() * 4;
    pushLine(s, 'accent', s.cmd ? `❯ ${s.cmd}` : '❯ zsh');
    emit('status', s);
    s.timer = setTimeout(() => tick(s), 500);
  }

  /* Real backend: memory = RSS summed over the pane PID's whole process
     tree (shell + agent + children it spawned), sampled every few seconds
     via `ps -axo pid,ppid,rss`. Shell-only RSS would be misleading. */
  setInterval(() => {
    for (const s of sessions.values()) {
      if (s.status === 'stopped' || s.mem == null) continue;
      s.mem = Math.max(4, s.mem * (0.96 + Math.random() * 0.1));
      emit('mem', s);
    }
  }, 3000);

  const api = {
    /* --- projects --- */
    projects: () => [...projects.values()],
    project: pid => projects.get(pid),

    createProject(name) {
      /* Default boards express attention, not workflow stage — this is agent
         management, not task management (a "Done" column is meaningless when
         closing a card is the end of a session). Placement is always manual:
         status dots and waiting highlights carry the information, the user
         makes the moves. */
      const p = {
        id: id('P'),
        name,
        columns: ['Attention', 'Working', 'Queued', 'Parked']
          .map(n => ({ id: id('C'), name: n })),
      };
      projects.set(p.id, p);
      emit('projects', p);
      return p;
    },
    renameProject(pid, name) {
      projects.get(pid).name = name;
      emit('projects');
    },
    removeProject(pid) {
      for (const s of [...sessions.values()]) {
        if (s.projectId === pid) { clearTimeout(s.timer); sessions.delete(s.id); }
      }
      projects.delete(pid);
      emit('projects');
    },

    /* --- columns (boards inside a project) --- */
    addColumn(pid, name) {
      const col = { id: id('C'), name };
      projects.get(pid).columns.push(col);
      emit('projects');
      return col;
    },
    renameColumn(pid, cid, name) {
      const col = projects.get(pid).columns.find(c => c.id === cid);
      if (col) col.name = name;
      emit('projects');
    },
    removeColumn(pid, cid) {
      const p = projects.get(pid);
      if (p.columns.length <= 1) return false;
      p.columns = p.columns.filter(c => c.id !== cid);
      const fallback = p.columns[0].id;
      let moved = 0;
      for (const s of sessions.values()) {
        if (s.projectId === pid && s.columnId === cid) { s.columnId = fallback; moved++; }
      }
      emit('projects');
      return { fallback: p.columns[0].name, moved };
    },

    /* --- sessions --- */
    list: pid => [...sessions.values()].filter(s => !pid || s.projectId === pid),
    get: sid => sessions.get(sid),
    subscribe: fn => { listeners.add(fn); return () => listeners.delete(fn); },

    create({ projectId, columnId, title, cmd, dir, desc = '', autostart = false }) {
      const s = {
        id: id('S'),
        projectId, columnId,
        title, cmd, dir, desc,
        status: 'stopped',
        mem: null,
        buffer: [], cursor: 0, timer: null,
      };
      sessions.set(s.id, s);
      emit('list', s);
      if (autostart) start(s);
      return s;
    },

    start: sid => start(sessions.get(sid)),

    /* Attach/detach = output-stream subscription, nothing more. The tmux
       session and its processes keep running either way; a detached session
       costs ~0 CPU, so nothing is killed on detach. Real backend: attach
       opens the PTY byte stream for xterm.js; detach closes it and the
       board falls back to low-frequency tail polling for card previews. */
    attach(sid) { /* no-op in mock */ },
    detach(sid) { /* no-op in mock */ },

    rename(sid, title) {
      const s = sessions.get(sid);
      if (s) { s.title = title; emit('list', s); }
    },

    setDesc(sid, desc) {
      const s = sessions.get(sid);
      if (s) { s.desc = desc; emit('list', s); }
    },

    /* stop and delete are one operation: closing a card terminates its shell */
    close(sid) {
      const s = sessions.get(sid);
      if (!s) return;
      clearTimeout(s.timer);
      sessions.delete(sid);
      emit('list', s);
    },

    move(sid, columnId) {
      const s = sessions.get(sid);
      if (!s || s.columnId === columnId) return;
      s.columnId = columnId;
      emit('list', s);
    },

    input(sid, text) {
      const s = sessions.get(sid);
      if (!s || s.status === 'stopped') return;
      pushLine(s, 'accent', `❯ ${text}`);
      if (s.status === 'waiting') {
        s.status = 'running';
        emit('status', s);
        pushLine(s, 'text', '  Got it — continuing.');
        s.timer = setTimeout(() => tick(s), 700);
      }
    },
  };
  return api;
}

const provider = MockProvider();

/* seed: two projects so tabs and per-project boards are visible */

provider.create({ projectId: pMain.id, columnId: col(pMain, 1), title: 'fix flaky scheduler test', cmd: 'claude', dir: HOME + '/orchestrator', autostart: true, desc: 'Intermittent failure in scheduler::retry; suspect the shared tempdir between test cases. Goal: isolate per-test tempdirs and stabilize CI before the 0.9 release cut.' });
provider.create({ projectId: pMain.id, columnId: col(pMain, 3), title: 'migration dry-run', cmd: '', dir: HOME });
provider.create({ projectId: pMain.id, columnId: col(pMain, 3), title: 'PR #42 review notes', cmd: 'claude', dir: HOME + '/orchestrator' });

/* ---------- app state ---------- */
const state = {
  projectId: pMain.id,
  view: 'board',          // 'board' | 'session'
  sessionId: null,
  renderedLines: 0,
};

const $ = id => document.getElementById(id);
const activeProject = () => provider.project(state.projectId);

/* hints for the default attention-based boards */
const COL_HINTS = {
  Attention: 'things you want to deal with next',
  Working: 'running autonomously, nothing needed from you',
  Queued: 'created but not started yet',
  Parked: 'kept around, low priority',
};

/* ---------- toasts ---------- */
function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  $('toasts').appendChild(el);
  setTimeout(() => el.remove(), 2600);
}

/* ---------- inline rename helper ---------- */
function inlineRename(host, current, onDone, allowEmpty = false) {
  const input = document.createElement('input');
  input.value = current;
  host.replaceChildren(input);
  input.focus();
  input.select();
  let done = false;
  const finish = commit => {
    if (done) return;
    done = true;
    const v = input.value.trim();
    onDone(!commit ? null : (v || (allowEmpty ? '' : null)));
  };
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') finish(true);
    if (e.key === 'Escape') finish(false);
    e.stopPropagation();
  });
  input.addEventListener('blur', () => finish(true));
  input.addEventListener('click', e => e.stopPropagation());
  input.addEventListener('dblclick', e => e.stopPropagation());
}

/* ---------- sidebar ---------- */
function renderSidebar() {
  const list = $('side-list');
  const st = list.scrollTop;
  list.innerHTML = '';
  const all = provider.list(state.projectId);
  const order = { waiting: 0, running: 1, stopped: 2 };
  all.sort((a, b) => order[a.status] - order[b.status]);
  $('side-count').textContent = all.length;
  for (const s of all) {
    const el = document.createElement('div');
    el.className = 'side-item' + (state.view === 'session' && state.sessionId === s.id ? ' active' : '');
    el.title = s.title;
    el.innerHTML = `<span class="dot ${s.status}"></span><span class="name"></span><span class="col-tag"></span>`;
    el.querySelector('.name').textContent = s.title;
    const c = activeProject().columns.find(c => c.id === s.columnId);
    el.querySelector('.col-tag').textContent = c ? c.name : '';
    el.onclick = () => openSession(s.id);
    el.oncontextmenu = e => showSessionCtx(e, s.id);
    list.appendChild(el);
  }
  list.scrollTop = st;
  $('home-btn').classList.toggle('active', state.view === 'board');
}

/* ---------- project tabs ---------- */
function renderTabs() {
  const bar = $('tabs');
  bar.innerHTML = '';
  for (const p of provider.projects()) {
    const el = document.createElement('div');
    el.className = 'tab' + (p.id === state.projectId ? ' active' : '');
    el.innerHTML = `<span class="name"></span>`;

    if (p.id !== state.projectId &&
        provider.list(p.id).some(s => s.status === 'waiting')) {

    }

function renameTab(el, p) {
  inlineRename(el, p.name, v => {
    if (v) provider.renameProject(p.id, v);
    render();
  });
}

function switchProject(pid) {
  if (state.projectId === pid && state.view === 'board') return;
  state.projectId = pid;
  state.view = 'board';
  state.sessionId = null;
  render();
}

/* ---------- board ---------- */
function renderBoard() {
  $('board-title').textContent = activeProject().name;
  const wrap = $('columns');
  /* preserve scroll positions across rebuilds — with many cards, losing them
     on every create/move/close is disorienting */
  const hScroll = wrap.scrollLeft;
  const colScroll = {};
  wrap.querySelectorAll('.column[data-cid]').forEach(el => {
    colScroll[el.dataset.cid] = el.querySelector('.col-cards').scrollTop;
  });
  wrap.innerHTML = '';
  const p = activeProject();
  const all = provider.list(p.id);

  for (const c of p.columns) {
    const colEl = document.createElement('div');
    colEl.className = 'column';
    colEl.dataset.cid = c.id;
    const cards = all.filter(s => s.columnId === c.id);
    colEl.innerHTML = `
      <div class="col-head">
        <span class="col-name" title="double-click to rename"></span>
        <span class="count">${cards.length}</span>
        <button class="col-del" title="Delete board">✕</button>
      </div>
      <div class="col-cards"></div>`;
    const nameEl = colEl.querySelector('.col-name');
    nameEl.textContent = c.name;
    const hint = COL_HINTS[c.name];
    nameEl.title = (hint ? hint + ' · ' : '') + 'double-click to rename';
    nameEl.ondblclick = () => {
      inlineRename(nameEl, c.name, v => {
        if (v) provider.renameColumn(p.id, c.id, v);
        render();
      });
    };
    colEl.querySelector('.col-del').onclick = e => {
      e.stopPropagation();
      if (p.columns.length <= 1) { toast('a project needs at least one board'); return; }
      if (cards.length &&
          !confirm(`Delete board "${c.name}"? Its ${cards.length} card(s) move to "${p.columns.find(x => x.id !== c.id).name}".`)) return;
      const r = provider.removeColumn(p.id, c.id);
      if (r && r.moved) toast(`moved ${r.moved} card(s) to ${r.fallback}`);
    };

    /* dragenter/leave counter: plain dragleave fires when crossing child
       elements, which makes the highlight flicker over every card */
    let dragDepth = 0;
    colEl.addEventListener('dragover', e => e.preventDefault());
    colEl.addEventListener('dragenter', e => {
      e.preventDefault();
      dragDepth++;
      colEl.classList.add('drop-target');
    });
    colEl.addEventListener('dragleave', () => {
      if (--dragDepth <= 0) { dragDepth = 0; colEl.classList.remove('drop-target'); }
    });
    colEl.addEventListener('drop', e => {
      e.preventDefault();
      dragDepth = 0;
      colEl.classList.remove('drop-target');
      const sid = e.dataTransfer.getData('text/deck-session');
      if (sid) { provider.move(sid, c.id); toast(`moved to ${c.name}`); }
    });

    const body = colEl.querySelector('.col-cards');
    for (const s of cards) body.appendChild(cardEl(s));
    wrap.appendChild(colEl);
  }

  const ghost = document.createElement('div');
  ghost.className = 'col-ghost';
  ghost.innerHTML = '<button>＋ New board</button>';
  ghost.querySelector('button').onclick = () => {
    const c = provider.addColumn(p.id, 'new board');
    render();
    wrap.scrollLeft = wrap.scrollWidth;   // bring the new board into view
    const heads = document.querySelectorAll('#columns .column .col-name');
    const nameEl = heads[heads.length - 1];
    if (nameEl) inlineRename(nameEl, c.name, v => {
      if (v) provider.renameColumn(p.id, c.id, v);
      render();
    });
  };
  wrap.appendChild(ghost);

  wrap.scrollLeft = hScroll;
  wrap.querySelectorAll('.column[data-cid]').forEach(el => {
    const st = colScroll[el.dataset.cid];
    if (st) el.querySelector('.col-cards').scrollTop = st;
  });
}

function cardEl(s) {
  const el = document.createElement('div');
  el.className = 'card' + (s.status === 'waiting' ? ' waiting' : '');
  el.dataset.sid = s.id;
  el.draggable = true;

  const tail = s.buffer.slice(-2);
  const tailHtml = tail.length
    ? `<div class="card-tail">${tail.map(l =>
        `<div class="${l.kind === 'wait' ? 'wait-line' : ''}"></div>`).join('')}</div>`
    : '';
  el.innerHTML = `
    <div class="card-top"><span class="dot ${s.status}"></span><span class="card-title"></span><span class="mem-chip" title="Memory of the whole session process tree: shell + agent + spawned children (mock values)"></span></div>
    <div class="card-meta"><span class="cmd"></span><span class="dir"></span></div>
    ${s.desc ? '<div class="card-desc"></div>' : ''}
    ${tailHtml}
    <div class="card-actions">
      <button class="chip-btn accent" data-act="open">open</button>
      ${s.status === 'stopped' ? '<button class="chip-btn" data-act="start">start</button>' : ''}
      <button class="chip-btn danger" data-act="close">close</button>
      <button class="chip-btn" data-act="menu">⋯</button>
    </div>`;
  el.querySelector('.card-title').textContent = s.title;
  setMemChip(el.querySelector('.mem-chip'), s);
  el.querySelector('.cmd').textContent = s.cmd ? '$ ' + s.cmd : '$ zsh';
  el.querySelector('.dir').textContent = s.dir;
  if (s.desc) {
    const d = el.querySelector('.card-desc');
    d.textContent = s.desc;
    d.title = s.desc;   /* truncated on the card; hover shows the full text */
  }
  const tailDivs = el.querySelectorAll('.card-tail div');
  tail.forEach((l, i) => { tailDivs[i].textContent = l.text; });

  el.addEventListener('dragstart', e => {
    e.dataTransfer.setData('text/deck-session', s.id);
    el.classList.add('dragging');
  });
  el.addEventListener('dragend', () => el.classList.remove('dragging'));
  el.addEventListener('click', e => {
    const act = e.target.dataset && e.target.dataset.act;
    if (act === 'start') { provider.start(s.id); toast(`started: ${s.title}`); return; }
    if (act === 'close') { closeSession(s.id); return; }
    if (act === 'menu') { showSessionCtx(e, s.id); return; }
    openSession(s.id);
  });
  el.oncontextmenu = e => showSessionCtx(e, s.id);
  return el;
}

function fmtMem(mb) {
  return mb >= 1024 ? (mb / 1024).toFixed(1) + 'G' : Math.round(mb) + 'M';
}

function setMemChip(chip, s) {
  if (!chip) return;
  chip.textContent = s.mem == null ? '' : fmtMem(s.mem);
  chip.classList.toggle('high', s.mem != null && s.mem > 1536);
}

/* close = stop + delete, one confirmed operation */
function closeSession(sid) {
  const s = provider.get(sid);
  if (!s) return;
  const live = s.status !== 'stopped';
  if (!confirm(`Close "${s.title}"?${live ? ' The shell will be terminated.' : ''}`)) return;
  provider.close(sid);
  if (state.sessionId === sid) backToBoard();
  toast(`closed: ${s.title}`);
}

/* ---------- session view ---------- */
function openSession(sid) {
  const s = provider.get(sid);
  if (!s) return;
  if (state.sessionId && state.sessionId !== sid) provider.detach(state.sessionId);
  state.projectId = s.projectId;
  if (s.status === 'stopped' && s.buffer.length === 0) provider.start(sid);
  provider.attach(sid);
  state.view = 'session';
  state.sessionId = sid;
  state.renderedLines = 0;
  $('terminal').innerHTML = '';
  render();
  $('term-input').focus();
}

function backToBoard() {
  if (state.sessionId) provider.detach(state.sessionId);
  state.view = 'board';
  state.sessionId = null;
  render();
}

/* Detect URLs and file paths in terminal output and render them clickable.
   URL alternative first, so a URL isn't half-claimed by the path pattern.
   Paths need at least one '/' (or a ~/name) so plain words never match. */
const LINK_RE = /(https?:\/\/[^\s"'`)\]]+)|((?:~\/|\.{0,2}\/)?[\w.\-]+(?:\/[\w.\-]+)+(?::\d+(?::\d+)?)?|~\/[\w.\-]+)/g;

/* single-slash word pairs like "y/n" or "and/or" aren't paths — demand a
   path prefix, depth ≥ 2, or a file extension on the last segment */
function looksLikePath(v) {
  if (/^(~\/|\.{1,2}\/|\/)/.test(v)) return true;
  if (v.split('/').length > 2) return true;
  return /\.[A-Za-z0-9]{1,8}(?::\d+(?::\d+)?)?$/.test(v.split('/').pop());
}

function linkify(container, text) {
  let last = 0;
  LINK_RE.lastIndex = 0;
  let m;
  while ((m = LINK_RE.exec(text)) !== null) {
    let value = m[0];
    while (/[.,;:]$/.test(value)) value = value.slice(0, -1);   // trailing punctuation
    const kind = m[1] ? 'url' : 'path';
    if (kind === 'path' && !looksLikePath(value)) continue;
    if (m.index > last) container.appendChild(document.createTextNode(text.slice(last, m.index)));
    const span = document.createElement('span');
    span.className = 't-link';
    span.dataset.kind = kind;
    span.textContent = value;
    container.appendChild(span);
    last = m.index + value.length;
  }
  if (last < text.length) container.appendChild(document.createTextNode(text.slice(last)));
}

function lineEl(l) {
  const div = document.createElement('div');
  div.className = 't-line ' + ({ dim: 't-dim', accent: 't-accent', wait: 't-wait', err: 't-err' }[l.kind] || '');
  linkify(div, l.text);
  return div;
}

function renderSessionView() {
  const s = provider.get(state.sessionId);
  if (!s) { backToBoard(); return; }
  $('sess-dot').className = 'dot ' + s.status;
  $('sess-name').textContent = s.title;
  setMemChip($('sess-mem'), s);
  $('sess-path').textContent = (s.cmd ? '$ ' + s.cmd + '  ·  ' : '') + s.dir;

  const sel = $('sess-col');
  sel.innerHTML = activeProject().columns.map(c =>
    `<option value="${c.id}" ${c.id === s.columnId ? 'selected' : ''}></option>`).join('');
  [...sel.options].forEach((o, i) => { o.textContent = activeProject().columns[i].name; });

  const term = $('terminal');
  const pinned = term.scrollHeight - term.scrollTop - term.clientHeight < 40;
  for (let i = state.renderedLines; i < s.buffer.length; i++) term.appendChild(lineEl(s.buffer[i]));
  state.renderedLines = s.buffer.length;
  if (pinned) term.scrollTop = term.scrollHeight;
}

/* ---------- context menus ---------- */
function placeCtx(e) {
  const ctx = $('ctx');
  ctx.style.display = 'block';
  ctx.style.left = Math.min(e.clientX, innerWidth - ctx.offsetWidth - 8) + 'px';
  ctx.style.top = Math.min(e.clientY, innerHeight - ctx.offsetHeight - 8) + 'px';
}

function editDescInline(sid) {
  const s = provider.get(sid);
  const card = document.querySelector(`.card[data-sid="${sid}"]`);
  if (!card) {
    /* no card on screen (e.g. sidebar in session view) — plain prompt fallback */
    const v = prompt('Description', s.desc || '');
    if (v !== null) provider.setDesc(sid, v.trim());
    return;
  }
  let d = card.querySelector('.card-desc');
  if (!d) {
    d = document.createElement('div');
    d.className = 'card-desc';
    card.querySelector('.card-meta').after(d);
  }
  inlineRename(d, s.desc || '', v => {
    if (v !== null) provider.setDesc(sid, v);
    render();
  }, true);
}

function showSessionCtx(e, sid) {
  e.preventDefault();
  e.stopPropagation();
  const s = provider.get(sid);
  const p = provider.project(s.projectId);
  const ctx = $('ctx');
  ctx.innerHTML = `
    <button data-a="rename">Rename card</button>
    <button data-a="desc">${s.desc ? 'Edit' : 'Add'} description</button>
    ${s.status === 'stopped' ? '<button data-a="start">Start</button>' : ''}
    <button data-a="here">New session in this directory</button>
    <hr>
    <div class="ctx-label">Move to</div>
    ${p.columns.filter(c => c.id !== s.columnId).map(c =>
      `<button data-a="move" data-col="${c.id}">→ ${c.name}</button>`).join('')}
    <hr>
    <button data-a="close" class="danger">Close session</button>`;
  ctx.onclick = ev => {
    const a = ev.target.dataset && ev.target.dataset.a;
    ctx.style.display = 'none';
    if (a === 'rename') renameCardInline(sid);
    if (a === 'desc') editDescInline(sid);
    if (a === 'start') { provider.start(sid); toast(`started: ${s.title}`); }
    if (a === 'here') openModal({ dir: s.dir });
    if (a === 'move') {
      const cid = ev.target.dataset.col;
      provider.move(sid, cid);
      toast(`moved to ${p.columns.find(c => c.id === cid).name}`);
    }
    if (a === 'close') closeSession(sid);
  };
  placeCtx(e);
}

function showProjectCtx(e, pid) {
  e.preventDefault();
  e.stopPropagation();
  const p = provider.project(pid);
  const ctx = $('ctx');
  ctx.innerHTML = `
    <button data-a="rename">Rename project</button>
    <button data-a="remove" class="danger">Delete project</button>`;
  ctx.onclick = ev => {
    const a = ev.target.dataset && ev.target.dataset.a;
    ctx.style.display = 'none';
    if (a === 'rename') {
      switchProject(pid);
      const tab = document.querySelector('#tabs .tab.active');
      if (tab) renameTab(tab, p);
    }
    if (a === 'remove') {
      if (provider.projects().length <= 1) { toast('at least one project is required'); return; }
      const n = provider.list(pid).length;
      if (!confirm(`Delete project "${p.name}"?${n ? ` Its ${n} session(s) will be closed.` : ''}`)) return;
      provider.removeProject(pid);
      if (state.projectId === pid) {
        state.projectId = provider.projects()[0].id;
        state.view = 'board';
        state.sessionId = null;
      }
      toast(`deleted project: ${p.name}`);
      render();
    }
  };
  placeCtx(e);
}

/* click menu for detected paths / URLs in terminal output */
function showLinkCtx(e, kind, value) {
  const ctx = $('ctx');
  ctx.innerHTML = `<span class="ctx-value"></span>` + (kind === 'url'
    ? `<button data-a="browse">Open in browser</button>
       <button data-a="copy">Copy URL</button>`
    : `<button data-a="edit">Open in editor</button>
       <button data-a="reveal">Reveal in Finder</button>
       <button data-a="copy">Copy path</button>`);
  ctx.querySelector('.ctx-value').textContent = value;
  ctx.onclick = ev => {
    const a = ev.target.dataset && ev.target.dataset.a;
    ctx.style.display = 'none';
    if (a === 'browse') {
      window.open(value, '_blank', 'noopener');
      toast(`opening ${value}`);
    }
    if (a === 'copy') {
      (navigator.clipboard ? navigator.clipboard.writeText(value) : Promise.reject())
        .then(() => toast('copied'), () => toast('copy failed'));
    }
    if (a === 'edit') toast(`(mock) default editor opens ${value}`);
    if (a === 'reveal') toast(`(mock) Finder reveals ${value}`);
  };
  placeCtx(e);
}

$('terminal').addEventListener('click', e => {
  const link = e.target.closest('.t-link');
  if (!link) return;
  e.stopPropagation();
  showLinkCtx(e, link.dataset.kind, link.textContent);
});

document.addEventListener('click', () => { $('ctx').style.display = 'none'; });

/* ---------- new-session modal ---------- */
function openModal(prefill = {}) {
  $('overlay').style.display = 'flex';
  $('f-title').value = '';
  $('f-cmd').value = prefill.cmd !== undefined ? prefill.cmd : 'claude';
  $('f-dir').value = prefill.dir || HOME;
  document.querySelectorAll('.preset').forEach(pr =>
    pr.classList.toggle('on', pr.dataset.cmd === $('f-cmd').value));
  $('f-title').focus();
}
function closeModal() { $('overlay').style.display = 'none'; }

function createFromModal(open) {
  const title = $('f-title').value.trim();
  if (!title) { $('f-title').focus(); return; }
  const p = activeProject();
  const byName = n => p.columns.find(c => c.name === n);
  const columnId = open
    ? (byName('Working') || p.columns[1] || p.columns[0]).id
    : (byName('Queued') || p.columns[0]).id;
  const s = provider.create({
    projectId: p.id,
    columnId,
    title,
    cmd: $('f-cmd').value.trim(),
    dir: $('f-dir').value.trim() || HOME,
    autostart: open,
  });
  closeModal();
  toast(`created: ${title}`);
  if (open) {
    openSession(s.id);
  } else {
    const el = document.querySelector(`.card[data-sid="${s.id}"]`);
    if (el) el.scrollIntoView({ block: 'nearest' });
  }
}

$('preset-row').addEventListener('click', e => {
  if (!e.target.classList.contains('preset')) return;
  $('f-cmd').value = e.target.dataset.cmd;
  document.querySelectorAll('.preset').forEach(p => p.classList.toggle('on', p === e.target));
});
$('m-cancel').onclick = closeModal;
$('m-create').onclick = () => createFromModal(false);
$('m-open').onclick = () => createFromModal(true);
$('overlay').addEventListener('mousedown', e => { if (e.target === $('overlay')) closeModal(); });

/* ---------- chrome wiring ---------- */
function toggleSidebar() {
  document.body.classList.toggle('side-collapsed');
  const collapsed = document.body.classList.contains('side-collapsed');
  $('collapse-btn').title = (collapsed ? 'Expand' : 'Collapse') + ' sidebar (⌘B)';
  $('collapse-btn').firstElementChild.style.transform = collapsed ? 'scaleX(-1)' : '';
}
$('collapse-btn').onclick = toggleSidebar;
$('home-btn').onclick = backToBoard;
$('back-btn').onclick = backToBoard;
$('board-new').onclick = () => openModal();
$('side-new').onclick = () => openModal();
$('sess-new-here').onclick = () => {
  const s = provider.get(state.sessionId);
  openModal({ dir: s ? s.dir : HOME });
};
$('sess-close').onclick = () => closeSession(state.sessionId);
$('sess-col').addEventListener('change', e => {
  provider.move(state.sessionId, e.target.value);
  const c = activeProject().columns.find(c => c.id === e.target.value);
  toast(`moved to ${c.name}`);
});
$('term-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.value.trim()) {
    provider.input(state.sessionId, e.target.value.trim());
    e.target.value = '';
  }
});
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'b') { e.preventDefault(); toggleSidebar(); return; }
  if (e.key === 'Escape') {
    if ($('overlay').style.display === 'flex') { closeModal(); return; }
    if ($('ctx').style.display === 'block') { $('ctx').style.display = 'none'; return; }
    if (state.view === 'session') backToBoard();
  }
});

/* ---------- render root ---------- */
function render() {
  $('board-view').style.display = state.view === 'board' ? 'flex' : 'none';
  $('session-view').style.display = state.view === 'session' ? 'flex' : 'none';
  renderTabs();
  renderSidebar();
  if (state.view === 'board') renderBoard();
  else renderSessionView();
}

/* Incremental updates: high-frequency 'output' events must not rebuild the DOM,
   or clicks land on destroyed elements and hover state churns. */
function updateCardInPlace(s) {
  const el = document.querySelector(`.card[data-sid="${s.id}"]`);
  if (!el) return;
  const tail = s.buffer.slice(-2);
  let tailEl = el.querySelector('.card-tail');
  if (!tailEl && tail.length) {
    tailEl = document.createElement('div');
    tailEl.className = 'card-tail';
    (el.querySelector('.card-desc') || el.querySelector('.card-meta')).after(tailEl);
  }
  if (tailEl) {
    tailEl.replaceChildren(...tail.map(l => {
      const d = document.createElement('div');
      d.className = l.kind === 'wait' ? 'wait-line' : '';
      d.textContent = l.text;
      return d;
    }));
  }
  const dot = el.querySelector('.dot');
  if (dot) dot.className = 'dot ' + s.status;
  el.classList.toggle('waiting', s.status === 'waiting');
}

provider.subscribe((ev, s) => {
  /* don't clobber an in-progress inline rename */
  if (document.activeElement && document.activeElement.tagName === 'INPUT'
      && document.activeElement.closest('#tabs, .col-head, .card, .side-item')) return;

  if (ev === 'mem') {
    if (state.view === 'session' && s.id === state.sessionId) setMemChip($('sess-mem'), s);
    else setMemChip(document.querySelector(`.card[data-sid="${s.id}"] .mem-chip`), s);
    return;
  }
  if (ev === 'output') {
    if (state.view === 'session' && s.id === state.sessionId) renderSessionView();
    else if (state.view === 'board' && s.projectId === state.projectId) updateCardInPlace(s);
    return;
  }
  if (ev === 'status') {
    renderTabs();
    renderSidebar();
    if (state.view === 'session' && s.id === state.sessionId) renderSessionView();
    else if (state.view === 'board' && s.projectId === state.projectId) updateCardInPlace(s);
    return;
  }
  /* structural changes: list / projects */
  render();
});

render();
</script>
</body>
</html>
